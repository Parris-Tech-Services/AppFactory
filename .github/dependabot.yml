version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must move together (react-dom@N requires react@N); separate PRs each fail to install
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; revisit when it does
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
