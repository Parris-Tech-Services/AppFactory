name: AutoPatch dependency validation

on:
  push:
    branches:
      - 'autopatch/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lockfile:
    name: Regenerate lockfile for isolated AutoPatch branch
    if: github.event_name == 'push' && github.repository == 'Parris-Tech-Services/AppFactory' && startsWith(github.ref, 'refs/heads/autopatch/') && github.actor == 'parristechservices-prog'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate npm lockfile (no package scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve safe npm advisories in lockfile without executing scripts
        run: npm audit fix --audit-level=high --package-lock-only --ignore-scripts --no-fund
      - name: Commit generated lockfile on isolated branch only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'chore(security): regenerate lockfile for AutoPatch'
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

  verify:
    name: Dependency, build and security checks
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.actor == 'parristechservices-prog' && startsWith(github.ref, 'refs/heads/autopatch/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
